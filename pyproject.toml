[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ambisecure-gp-secure-channel"
dynamic = ["version"]
description = "Reference host-side GlobalPlatform SCP03 (AES-128) and SCP02 (3DES) secure channels"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = ["pycryptodome>=3.10"]

[project.optional-dependencies]
test = ["pytest"]
pcsc = ["pyscard"]

[project.urls]
Source = "https://github.com/Ambimat-Electronics/ambisecure-gp-secure-channel"

[tool.setuptools]
packages = ["gp_secure_channel"]

[tool.setuptools.dynamic]
version = {attr = "gp_secure_channel.__version__"}

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
